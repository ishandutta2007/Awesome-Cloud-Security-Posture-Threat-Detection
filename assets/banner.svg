<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f72585" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.12); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -80; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }

    .bg-grid { fill: url(#cyberGrid); }
    .floating-radar {
      transform-origin: 1040px 200px;
      animation: radarSweep 16s linear infinite;
    }
    .orb-1 {
      transform-origin: 180px 140px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .orb-2 {
      transform-origin: 980px 260px;
      animation: pulseGlow 9s ease-in-out infinite alternate;
    }
    .stream-line {
      stroke-dasharray: 8, 12;
      animation: dashCycle 2.5s linear infinite;
    }
    .pill-group-1 { animation: pillFloat1 4.5s ease-in-out infinite; }
    .pill-group-2 { animation: pillFloat2 5.5s ease-in-out infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" class="bg-grid" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="180" cy="130" r="150" fill="#4facfe" class="orb-1" filter="url(#orbGlow)" />
  <circle cx="1000" cy="240" r="160" fill="#7209b7" class="orb-2" filter="url(#orbGlow)" />
  <circle cx="600" cy="380" r="110" fill="#00f2fe" opacity="0.15" filter="url(#orbGlow)" />

  <!-- Background Decorative Cyber Flow Elements -->
  <g opacity="0.35">
    <path d="M 0,340 C 350,300 450,390 800,320 C 1000,280 1100,350 1200,310" fill="none" stroke="#00f2fe" stroke-width="1.8" class="stream-line" />
    <path d="M 0,90 C 250,150 500,40 750,100 C 950,150 1100,70 1200,100" fill="none" stroke="#f72585" stroke-width="1.2" stroke-dasharray="6, 14" class="stream-line" style="animation-duration: 4s;" />
  </g>

  <!-- Dynamic Radar / Telemetry Compass (Right Side Graphic) -->
  <g opacity="0.45" transform="translate(0, 0)">
    <circle cx="1040" cy="200" r="140" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="1040" cy="200" r="95" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4, 4" />
    <circle cx="1040" cy="200" r="50" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.5" />
    <!-- Rotating crosshairs & scanner -->
    <g class="floating-radar">
      <line x1="1040" y1="60" x2="1040" y2="340" stroke="#00f2fe" stroke-width="0.75" stroke-opacity="0.6" />
      <line x1="900" y1="200" x2="1180" y2="200" stroke="#00f2fe" stroke-width="0.75" stroke-opacity="0.6" />
      <path d="M 1040,200 L 1140,110 A 140 140 0 0 0 1040 60 Z" fill="url(#cyberCyan)" opacity="0.18" />
    </g>
    <!-- Target Blips -->
    <circle cx="1080" cy="150" r="4.5" fill="#00f2fe" filter="url(#glowCyan)" />
    <circle cx="990" cy="240" r="3.5" fill="#38ef7d" />
    <circle cx="1060" cy="270" r="3" fill="#f72585" />
  </g>

  <!-- Foreground Shield Icon / Emblem -->
  <g transform="translate(80, 85)">
    <!-- Outer Shield Glow -->
    <path d="M 45,15 Q 90,0 135,15 Q 135,75 135,95 C 135,150 90,185 45,200 C 0,185 -45,150 -45,95 Q -45,75 -45,15 Q 0,0 45,15 Z" 
          fill="#0c1729" stroke="url(#cyberCyan)" stroke-width="2.5" filter="url(#glowCyan)" opacity="0.9" />
    <!-- Inner Shield Accent -->
    <path d="M 45,30 Q 80,18 115,30 Q 115,80 115,95 C 115,138 80,165 45,180 C 10,165 -25,138 -25,95 Q -25,80 -25,30 Q 10,18 45,30 Z" 
          fill="none" stroke="url(#neonPurple)" stroke-width="1.8" opacity="0.6" />
    <!-- Cloud Node in Shield -->
    <path d="M 28,105 C 22,105 18,100 18,94 C 18,88 22,83 28,83 C 29,83 30,83 31,84 C 33,76 40,70 48,70 C 57,70 65,77 66,86 C 68,85 70,84 72,84 C 77,84 82,88 82,94 C 82,100 77,105 72,105 Z" 
          fill="url(#cyberCyan)" />
    <!-- Node Dots & Circuit Links inside shield -->
    <circle cx="45" cy="125" r="4" fill="#38ef7d" />
    <line x1="45" y1="105" x2="45" y2="125" stroke="#38ef7d" stroke-width="2" />
    <line x1="45" y1="125" x2="25" y2="145" stroke="#38ef7d" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="45" y1="125" x2="65" y2="145" stroke="#38ef7d" stroke-width="1.5" stroke-dasharray="2,2" />
    <circle cx="25" cy="145" r="3" fill="#00f2fe" />
    <circle cx="65" cy="145" r="3" fill="#00f2fe" />
  </g>

  <!-- FOREGROUND MAIN HEADINGS (Kept Clean, Crisp & High-Contrast) -->
  <g transform="translate(260, 115)">
    <!-- Category Pill Tag -->
    <rect x="0" y="0" width="285" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#38ef7d" />
    <text x="28" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Cloud Security Posture
    </text>
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="url(#cyberCyan)" letter-spacing="-0.5">
      &amp; Runtime Threat Detection
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      The definitive directory of CNAPP, CSPM, CWPP, CIEM, DSPM &amp; eBPF security tools.
    </text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b">
      SaaS market intelligence, transparent starting tiers, and verified open-source GitHub alternatives.
    </text>
  </g>

  <!-- DYNAMIC FOREGROUND FEATURE PILLS (Positioned across the bottom bar) -->
  <g transform="translate(80, 340)">
    <!-- Pill 1 -->
    <g class="pill-group-1" transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" opacity="0.95" />
      <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8">🛡️ CNAPP &amp; CSPM</text>
    </g>

    <!-- Pill 2 -->
    <g class="pill-group-2" transform="translate(195, 0)">
      <rect x="0" y="0" width="200" height="34" rx="8" fill="#0f172a" stroke="#38ef7d" stroke-width="1.2" opacity="0.95" />
      <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#4ade80">⚡ eBPF Threat Telemetry</text>
    </g>

    <!-- Pill 3 -->
    <g class="pill-group-1" transform="translate(410, 0)">
      <rect x="0" y="0" width="190" height="34" rx="8" fill="#0f172a" stroke="#f72585" stroke-width="1.2" opacity="0.95" />
      <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f472b6">☸️ Kubernetes &amp; Containers</text>
    </g>

    <!-- Pill 4 -->
    <g class="pill-group-2" transform="translate(615, 0)">
      <rect x="0" y="0" width="195" height="34" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#a5b4fc">💰 Pricing &amp; Market Caps</text>
    </g>

    <!-- Pill 5 -->
    <g class="pill-group-1" transform="translate(825, 0)">
      <rect x="0" y="0" width="205" height="34" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" opacity="0.95" />
      <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#fde047">⭐ Stargazer-Ranked OSS</text>
    </g>
  </g>
</svg>
